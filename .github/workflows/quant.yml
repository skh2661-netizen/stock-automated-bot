# .github/workflows/quant.yml
name: V8.4.5 Quant Engine Automated

permissions:
  contents: write

on:
  workflow_dispatch:
  # 매일 한국 시간 09:10 (UTC 00:10) 실행을 원하시면 아래 주석을 해제하세요.
  # schedule:
  #   - cron: '10 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        # [핵심 수정] pandas-ta 최신 버전 호환을 위해 Python 3.10 -> 3.12로 업그레이드
        python-version: '3.12'

    - name: Install
      run: |
        python -m pip install --upgrade pip
        # V13 엔진 구동을 위한 전체 의존성 명시
        pip install pandas finance-datareader python-telegram-bot pytz yfinance requests beautifulsoup4 lxml numpy pandas-ta

    - name: Run Quant
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Commit DB
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 파일 존재 여부 확인 후 git add
        [ -f data/candidates.db ] && git add data/candidates.db
        [ -f holdings.json ] && git add holdings.json
        
        # 변경사항이 있을 때만 커밋 및 푸시
        if ! git diff --staged --quiet; then
            git commit -m "Auto-update DB and holdings"
            git push
        else
            echo "No changes to commit."
        fi
